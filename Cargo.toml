[workspace]
resolver = "3"
members = ["crates/cli", "crates/core", "crates/daemon", "crates/tui", "crates/vault","crates/creator"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["PeachGB <arianmateos@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/PeachGB/nimbus"
homepage = "https://github.com/PeachGB/nimbus"

[workspace.dependencies]
thiserror = "2.0.18"
futures = "0.3.32"
tokio = { version = "1.32.0", features = ["full"] }
tokio-util = {version = "0.7.18", features =["io"]}
chrono = {version = "0.4.45",features = ["serde"]}
async-trait = "0.1.89"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = {version = "1.0.150"}
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
toml = "1.1.2"
ratatui = "0.30.2"
crossterm = "0.29.0"
color-eyre = "0.6.5"
axum = "0.8.9"
anyhow = "1.0.104"
bytes = "1.12.0"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
tempfile = "3.27.0"
# TLS: everything on rustls 0.23 with the ring provider, the one reqwest already uses. Default
# features are off on purpose: rustls's and rcgen's defaults pull in aws-lc-rs, and with two
# providers compiled in, rustls panics at runtime unless a default provider is installed.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
axum-server = { version = "0.7.3", default-features = false, features = ["tls-rustls-no-provider"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
sha2 = "0.10"
# Encryption at rest (nimbus-vault's `crypt`): ring is already in the tree through rustls, so its
# ChaCha20-Poly1305, HKDF and OS RNG add no new crypto crate; zeroize and base64 are in the tree too.
ring = "0.17"
zeroize = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
