[package]
name = "nimbus-core"
description = """Session and vault-management logic shared by nimbus's frontends: the registry of \
named vaults, the current vault/directory, and the local staging vault, with no terminal code of \
its own."""
readme = "README.md"
documentation = "https://docs.rs/nimbus-core"
keywords = ["nimbus", "sync", "vault", "session"]
categories = ["filesystem", "command-line-interface"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
nimbus-vault = { version = "0.2.0", path = "../vault/" }
anyhow.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
toml.workspace = true
dirs.workspace = true

[dev-dependencies]
tokio.workspace = true
tempfile.workspace = true
