[package]
name = "nimbus-cli"
version = "0.1.0"
edition = "2024"
# `about` is not a manifest key — cargo ignored it, so this crate had no description at all.
description = """An interactive REPL for managing and syncing objects in vaults. A vault is a \
filesystem-like tree that stores metadata plus a way to reach the object, so one can be backed \
by an API, your own filesystem, a shell command, or another vault."""

[dependencies]
clap = {version="4.6.1",features=["derive"]}
tokio.workspace = true
nimbus-core = {path="../core/"}
nimbus-creator = {path="../creator/"}
ratatui.workspace = true
anyhow = "1.0.103"
rustyline = "18.0.1"
