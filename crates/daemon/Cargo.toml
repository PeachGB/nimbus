[package]
name = "nimbus-daemon"
description = """Serves a directory of nimbus vaults over HTTP, so a remote nimbus can mount \
them through the `http` origin."""
readme = "README.md"
documentation = "https://docs.rs/nimbus-daemon"
keywords = ["nimbus", "sync", "vault", "server", "http"]
categories = ["command-line-utilities", "web-programming::http-server"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
futures.workspace = true
nimbus-vault = { version = "0.2.1", path = "../vault/" }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
toml.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
bytes.workspace = true
reqwest.workspace = true
tempfile.workspace = true
