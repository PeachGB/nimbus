[package]
name = "nimbus-tui"
description = "A ranger-style terminal file manager over nimbus vaults, an object sync abstraction with customizable origins."
readme = "README.md"
documentation = "https://docs.rs/nimbus-tui"
keywords = ["nimbus", "tui", "ratatui", "file-manager", "sync"]
categories = ["command-line-utilities", "filesystem"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
color-eyre.workspace = true
crossterm.workspace = true
nimbus-core = { version = "0.2.0", path = "../core" }
nimbus-creator = { version = "0.2.0", path = "../creator" }
nimbus-vault = { version = "0.2.0", path = "../vault" }
ratatui.workspace = true
chrono.workspace = true
tokio.workspace = true

[target."cfg(unix)".dependencies]
libc = "0.2.189"
