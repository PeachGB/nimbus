[package]
name = "nimbus-creator"
description = "An interactive TUI wizard that builds a nimbus-vault vault.toml; embeddable from nimbus-cli or nimbus-tui, or run standalone."
readme = "README.md"
documentation = "https://docs.rs/nimbus-creator"
keywords = ["nimbus", "vault", "wizard", "ratatui", "tui"]
categories = ["command-line-interface", "config"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "nimbus-creator"
path = "src/bin/creator.rs"

[dependencies]
color-eyre.workspace = true
crossterm.workspace = true
ratatui.workspace = true
nimbus-vault = { version = "0.2.1", path = "../vault" }
dirs.workspace = true

[dev-dependencies]
tempfile.workspace = true
